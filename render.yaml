# Render blueprint for the SynthCouncil engine API.
# Deploy: push this repo to GitHub, then in Render select "Blueprint"
# (New + → Blueprint) and point it at this file.

services:
  - type: web
    name: synthcouncil-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @synthcouncil/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_URL
        value: https://synthcouncil.netlify.app
      # Secrets — set these in the Render dashboard (never in git):
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
